name: Documentation

on:
  push:
    branches: [core]
  pull_request:
    branches: [core]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/core'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Verify Pages uses the documentation workflow
        uses: actions/github-script@v8
        with:
          script: |
            const { data: pages } = await github.rest.repos.getPages(context.repo)
            if (pages.build_type !== 'workflow') {
              core.setFailed('Set Settings → Pages → Build and deployment → Source to GitHub Actions. Branch publishing runs Jekyll and overwrites VitePress.')
            }
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
