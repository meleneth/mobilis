name: WASI Ruby native extension build

on:
  workflow_dispatch:
  push:
    branches:
      - affordance-projection-foundation
    paths:
      - "native_wasm/**"
      - ".github/workflows/native-wasm.yml"
      - "generator_compatibility/probe_rails_wasm.mjs"
      - "view_component_compatibility/probe_view_component_wasm.mjs"

jobs:
  extensions:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.0"
          bundler-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore playground WASM tooling
        working-directory: playground
        run: npm ci
      - name: Install Ruby native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config cmake
      - name: Resolve pinned gem sources
        working-directory: native_wasm
        run: bundle install
      - name: Compile and statically link BigDecimal and Nokogiri
        run: native_wasm/bin/build build
      - name: Verify real native extensions in WASI
        run: node native_wasm/probe_extensions.mjs native_wasm/dist/ruby+stdlib.wasm
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-wasm-failure-evidence
          path: |
            native_wasm/dist/
          retention-days: 7
