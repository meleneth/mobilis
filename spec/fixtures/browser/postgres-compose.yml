---
services:
  database:
    image: postgres:18.3-trixie
    ports:
    - "${DATABASE_POSTGRES_PORT}:5432"
    environment:
    - POSTGRES_DB=${DATABASE_POSTGRES_DB}
    - POSTGRES_PASSWORD=${DATABASE_POSTGRES_PASSWORD}
    - POSTGRES_USER=${DATABASE_POSTGRES_USER}
    volumes:
    - "${DATABASE_POSTGRES_DATA}:/var/lib/postgresql"
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${DATABASE_POSTGRES_USER} -d ${DATABASE_POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    labels:
      app.kubernetes.io/managed-by: mobilis
      mobilis.io/project: browser-demo
      mobilis.io/service: database
