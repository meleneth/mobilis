stages:
  - build_image
  - test
  - build

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

default:
  image: docker:24.0.7-cli
  services:
    - docker:24.0.7-dind
  before_script:
    - apk add --no-cache curl git bash

# 👷 Build the custom Ruby + Docker Compose image
build_image:
  stage: build_image
  script:
    - echo "🛠️ Building mobilis-dev image..."
    - docker build -t mobilis-dev:latest .

# 🧪 Run RSpec inside the custom image
rspec:
  stage: test
  needs: [build_image]
  script:
    - docker run --rm -v "$PWD:/app" -w /app mobilis-dev:latest \
        bash -c '
          set -eux
          printf "\033[1;34m🧪 Running RSpec...\033[0m\n"
          bundle install
          bundle exec rspec --format=documentation --color
        '

# 🔍 Run Steep inside the custom image
steep:
  stage: test
  needs: [build_image]
  script:
    - docker run --rm -v "$PWD:/app" -w /app mobilis-dev:latest \
        bash -c '
          set -eux
          printf "\033[1;36m🔍 Running Steep...\033[0m\n"
          bundle install
          bundle exec steep check
        '

# 🚀 Run Mobilis generator with Docker Compose support
build_env:
  stage: build
  needs: [build_image]
  script:
    - docker run --rm -v "$PWD:/app" -w /app \
        --privileged \
        -e DOCKER_HOST=$DOCKER_HOST \
        mobilis-dev:latest \
        bash -c '
          set -eux
          docker compose version
          bundle install
          rake build
          gem install pkg/mobilis-*.gem --no-document
          export PATH="$(ruby -e '\''puts Gem.bindir'\''):$PATH"
          bundle exec mobilis generate testcases/rails-postgres.json
        '
