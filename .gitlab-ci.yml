image: ruby:3.4.2

before_script:
  - apt-get update && apt-get install -y git
  - bundle install
  - rake install

rspec:
  script:
    - bundle exec rspec

steep:
  script:
    - bundle exec steep check

build_env:
  image: ruby:3.4.2
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apt-get update -qq && apt-get install -y docker-compose git
    - gem install bundler
    - bundle install
  script:
    - rake build
    - gem install pkg/mobilis-*.gem --no-document --install-dir /usr/local/lib/ruby/gems/3.4.0
    - export PATH="/usr/local/lib/ruby/gems/3.4.0/bin:$PATH"
    - which mobilis
    - docker-compose version
    - bundle exec /usr/local/bundle/bin/mobilis generate testcases/rails-postgres.json
