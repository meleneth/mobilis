stages:
  - build_image
  - test
  - build

variables:
  DOCKER_TLS_CERTDIR: ""

default:
  image: docker:24.0.7-cli
  before_script:
    - unset DOCKER_HOST
    - apk add --no-cache curl git bash

# 🧱 Build the custom Ruby + Docker Compose image
build_image:
  stage: build_image
  script:
    - docker run --rm \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v "$PWD:/app" \
        -w /app \
        docker:24.0.7-cli \
        sh -c "docker build -t mobilis-dev:latest ."

# 🧪 RSpec tests
rspec:
  stage: test
  needs: [build_image]
  script:
    - docker run --rm \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v "$PWD:/app" \
        -w /app \
        mobilis-dev:latest bash -c '
          set -eux
          printf "\033[1;34m🧪 Running RSpec...\033[0m\n"
          bundle install
          bundle exec rspec --format=documentation --color
        '

# 🔍 Steep type checking
steep:
  stage: test
  needs: [build_image]
  script:
    - docker run --rm \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v "$PWD:/app" \
        -w /app \
        mobilis-dev:latest bash -c '
          set -eux
          printf "\033[1;36m🔍 Running Steep...\033[0m\n"
          bundle install
          bundle exec steep check
        '

# 🚀 Mobilis generator and Compose test
build_env:
  stage: build
  needs: [build_image]
  script:
    - docker run --rm \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v "$PWD:/app" \
        -w /app \
        mobilis-dev:latest bash -c '
          set -eux
          docker compose version
          bundle install
          rake build
          gem install pkg/mobilis-*.gem --no-document
          export PATH="$(ruby -e '\''puts Gem.bindir'\''):$PATH"
          bundle exec mobilis generate testcases/rails-postgres.json
        '
