image: ruby:3.4.2

before_script:
  - apt-get update && apt-get install -y git
  - bundle install
  - rake install

rspec:
  script:
    - echo -e "\e[1;34m🧪 Running RSpec tests...\e[0m"
    - bundle exec rspec --format=documentation --color

steep:
  script:
    - echo -e "\e[1;36m🔍 Running Steep type checker...\e[0m"
    - bundle exec steep check

build_env:
  image: ruby:3.4.2
  services:
    - docker:24.0.7-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo -e "\e[1;33m🔧 Installing Docker Compose plugin...\e[0m"
    - apt-get update -qq && apt-get install -y curl gnupg git
    - mkdir -p /usr/local/lib/docker/cli-plugins
    - curl -SL https://github.com/docker/compose/releases/download/v2.24.2/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
    - chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
    - echo -e "\e[1;35m📦 Setting up Ruby dependencies...\e[0m"
    - gem install bundler
    - bundle install
  script:
    - echo -e "\e[1;34m🐳 Docker Compose version:\e[0m"
    - docker compose version
    - echo -e "\e[1;35m📦 Building Mobilis gem...\e[0m"
    - rake build
    - echo -e "\e[1;32m🧪 Installing Mobilis gem...\e[0m"
    - gem install pkg/mobilis-*.gem --no-document --install-dir /usr/local/lib/ruby/gems/3.4.0
    - export PATH="/usr/local/lib/ruby/gems/3.4.0/bin:$PATH"
    - echo -e "\e[1;36m🚀 Running Mobilis generate...\e[0m"
    - which mobilis
    - bundle exec /usr/local/bundle/bin/mobilis generate testcases/rails-postgres.json
