# Runs on your internal GitLab runner only. No GitHub Actions.
# Ruby follows the repository's pinned browser/runtime compatibility baseline.
stages:
  - verify
  - test

default:
  tags:
    - docker

variables:
  BUNDLE_JOBS: "4"
  BUNDLE_RETRY: "2"
  CARBN_REF: "2e26eeea593919d67e99403fb995392ff6e17384"

.ruby_job:
  image: ruby:4.0.10-trixie
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git build-essential pkg-config
    - bundle install

rspec:
  extends: .ruby_job
  stage: test
  script:
    - bundle exec rspec

steep:
  extends: .ruby_job
  stage: test
  script:
    - bundle exec steep check

diesl_parity:
  extends: .ruby_job
  stage: verify
  script:
    - ruby -c lib/mobilis/browser/diesl_editor.rb
    - ruby -c spec/mobilis/browser/diesl_editor_spec.rb
    - ruby -c playground/app/application.rb
    - ruby -c playground/app/boot.rb
    - ruby -c playground/scripts/build_examples.rb
    - bundle exec ruby -Ilib -e 'require "mobilis"; abort "Diesl eagerly loaded by native Mobilis" if $LOADED_FEATURES.any? { |entry| entry.end_with?("/diesl.rb") }'
    - bundle exec rspec spec/mobilis/browser/source_document_spec.rb spec/mobilis/browser/diesl_editor_spec.rb

browser_workspace:
  image: node:22-trixie
  stage: verify
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
  script:
    - node --check playground/public/workspace.js
    - node --check playground/public/application.js
    - grep -Fq "$CARBN_REF" Dockerfile.playground
    - git clone --quiet https://github.com/meleneth/carbn.git /tmp/carbn
    - git -C /tmp/carbn checkout --quiet "$CARBN_REF"
    - test "$(git -C /tmp/carbn rev-parse HEAD)" = "$CARBN_REF"
    - node --check /tmp/carbn/browser/git-capability.js
    - node --check /tmp/carbn/browser/workspace-history.js
    - node --check /tmp/carbn/browser/working-tree.js
    - node --test /tmp/carbn/test/workspace-history.test.mjs

docs:
  image: node:24-trixie
  stage: test
  script:
    - npm ci
    - npm run docs:check
