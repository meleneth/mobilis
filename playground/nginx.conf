server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header X-Content-Type-Options "nosniff" always;
  # ruby.wasm's js gem uses JS.eval while initializing its Ruby-to-JavaScript
  # bridge. `wasm-unsafe-eval` permits WebAssembly compilation but not that
  # JavaScript evaluation, so both CSP sources are required.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.wasm$ {
    types { application/wasm wasm; }
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
  }
}
