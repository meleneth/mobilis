# Prefer precomputed Brotli, then gzip, then identity for the immutable WASM.
# map is in http context because conf.d/*.conf is included from nginx's http block.
map $http_accept_encoding $ruby_wasm_encoding {
  default "";
  ~*br br;
  ~*gzip gzip;
}
map $ruby_wasm_encoding $ruby_wasm_suffix {
  default "";
  br ".br";
  gzip ".gz";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/javascript application/json application/wasm application/x-tar text/css;

  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header X-Content-Type-Options "nosniff" always;
  # ruby.wasm's js gem uses JS.eval while initializing its Ruby-to-JavaScript
  # bridge. `wasm-unsafe-eval` permits WebAssembly compilation but not that
  # JavaScript evaluation, so both CSP sources are required.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net; worker-src 'self' blob:" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.mjs$ {
    types { application/javascript mjs; }
    try_files $uri =404;
  }

  location ~* "^/vendor/ruby-[a-f0-9]{64}\.wasm$" {
    # The selected file may end in .br or .gz, but the response is WASM.
    types { }
    default_type application/wasm;
    gzip off;
    try_files $uri$ruby_wasm_suffix $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Vary "Accept-Encoding" always;
    add_header Content-Encoding $ruby_wasm_encoding always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
  }

  location ~* \.wasm$ {
    types { application/wasm wasm; }
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
  }

  location = /runtime-config.json {
    try_files $uri =404;
    add_header Cache-Control "no-store";
  }

  location = /mobilis-app-manifest.json {
    try_files $uri =404;
    add_header Cache-Control "no-store";
  }

  location ~* "^/mobilis-app-[a-f0-9]{64}\.tar$" {
    types { application/x-tar tar; }
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
